<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;700&family=Archivo+Black&family=Bagel+Fat+One&family=Noto+Sans+Thai:wght@400;500&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=44">
  <title>Design your keychain — Resincraftcode</title>
  <meta name="description" content="Design your own handmade resin keychain, then send it to Resincraftcode by DM.">
</head>
<body data-page="design" class="designer">
  <header class="site-header" id="site-header"></header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="Keychain preview">
      <div class="stage-top">
        <span class="wordmark">Resincraftcode</span>
        <button type="button" class="btn btn-ink small" id="done" data-i18n="big.done"></button>
      </div>
      <div class="stage-art" id="preview"></div>
      <p class="stage-hint" id="stage-hint" aria-live="polite"></p>
      <div class="stage-tools">
        <button type="button" class="tool icon" id="zoomout" data-i18n-aria="ui.zoomOut" aria-label="Zoom out">−</button>
        <button type="button" class="tool icon" id="zoomin" data-i18n-aria="ui.zoomIn" aria-label="Zoom in">+</button>
        <button type="button" class="tool" id="savedraft" data-i18n="ui.saveDraft"></button>
        <button type="button" class="tool" id="bigview" data-i18n="ui.bigView"></button>
        <button type="button" class="tool" id="startover" data-i18n="ui.startOver"></button>
      </div>
      <div class="studio-tools" id="studio-tools"></div>
    </section>

    <section class="studio">
      <nav class="steps" id="steps" aria-label="Steps"></nav>
      <div class="panel" id="panel"></div>
    </section>
  </main>

  <footer class="bar">
    <div class="price">
      <span class="price-label" data-i18n="ui.yourKeychain"></span>
      <strong id="total">฿0</strong>
    </div>
    <div class="bar-actions">
      <button type="button" class="btn btn-line" id="back"></button>
      <button type="button" class="btn btn-ink" id="next"></button>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button type="button" id="toast-action" hidden></button>
  </div>

  <script src="config.js?v=44"></script>
  <script src="i18n.js?v=44"></script>
  <script src="i18n-site.js?v=44"></script>
  <script src="i18n-extra.js?v=44"></script>
  <script src="core.js?v=44"></script>
  <script src="app.js?v=44"></script>
</body>
</html>
